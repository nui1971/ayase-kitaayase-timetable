<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>綾瀬 → 北綾瀬 発車案内</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #060c18;
    font-family: sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0;
  }

  .app {
    background: #0d1526;
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── ヘッダー ── */
  .header {
    padding: 14px 16px 10px;
    border-bottom: 0.5px solid rgba(255,255,255,0.08);
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .header-left {}
  .c19-badge {
    display: inline-block;
    background: #006400;
    color: #fff;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 4px;
    margin-bottom: 4px;
    letter-spacing: 0.03em;
  }
  .station-ja {
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.15;
  }
  .station-en {
    color: #8a9bb5;
    font-size: 11px;
    margin-top: 2px;
  }
  .header-right {
    text-align: right;
  }
  .current-time {
    color: #fff;
    font-size: 32px;
    font-weight: 300;
    line-height: 1;
    margin-bottom: 2px;
  }
  .current-date {
    color: #8a9bb5;
    font-size: 11px;
  }
  .cal-bar {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .cal-btn {
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }
  .cal-btn.active {
    background: #006400;
    color: #fff;
  }
  .cal-btn.inactive {
    background: rgba(255,255,255,0.07);
    color: #8a9bb5;
  }

  /* ── ボディ ── */
  .body {
    padding: 10px 12px 0;
    flex: 1;
  }
  .sec-label {
    font-size: 10px;
    font-weight: 500;
    color: #4a6580;
    letter-spacing: 0.06em;
    margin-top: 8px;
    margin-bottom: 6px;
  }

  /* ── 次の列車カード ── */
  .track-card {
    display: flex;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 10px;
    border: 0.5px solid rgba(255,255,255,0.06);
  }
  .card-line {
    width: 3px;
    flex-shrink: 0;
  }
  .card-line.orange { background: #e8703a; }
  .card-line.green  { background: #22c55e; }
  .card-inner {
    flex: 1;
    min-width: 0;
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
  }
  .card-header.orange { background: rgba(232,112,58,0.15); }
  .card-header.green  { background: rgba(34,197,94,0.12); }
  .track-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .track-dot.orange { background: #e8703a; }
  .track-dot.green  { background: #22c55e; }
  .track-name {
    font-size: 12px;
    font-weight: 500;
  }
  .track-name.orange { color: #f5a07a; }
  .track-name.green  { color: #7ec8a0; }
  .track-sub {
    font-size: 10px;
    margin-left: auto;
  }
  .track-sub.orange { color: #8a5a40; }
  .track-sub.green  { color: #3a7050; }
  .card-body {
    padding: 12px 14px;
  }
  .card-body.orange { background: rgba(10,8,6,0.85); }
  .card-body.green  { background: rgba(6,10,8,0.85); }
  .next-label {
    font-size: 12px;
    color: #4a9e6a;
    margin-bottom: 6px;
  }
  .next-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .next-time {
    font-size: 32px;
    font-weight: 300;
    color: #fff;
    line-height: 1;
  }

  /* ── 種別バッジ ── */
  .type-badge {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .badge-local { background: #3a4a5a; color: #c8d6e8; }
  .badge-semi  { background: #1a3a7a; color: #90b8f0; }
  .badge-exp   { background: #7a1a1a; color: #f09090; }

  .next-remain {
    margin-left: auto;
    display: flex;
    align-items: baseline;
    gap: 2px;
    white-space: nowrap;
  }
  .remain-pre  { font-size: 11px; color: #4a9e6a; }
  .remain-val  { font-size: 22px; font-weight: 500; color: #4a9e6a; line-height: 1; }
  .remain-unit { font-size: 11px; color: #4a9e6a; }

  /* ── 列車リスト ── */
  .list-section {
    margin-top: 4px;
  }
  .list-header {
    font-size: 11px;
    font-weight: 500;
    color: #c8d6e8;
    margin-bottom: 5px;
  }
  .list-rows {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .list-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 9px;
    background: rgba(255,255,255,0.04);
  }
  .platform-badge {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .pb-0  { background: rgba(232,112,58,0.2); color: #f5a07a; }
  .pb-34 { background: rgba(34,197,94,0.15); color: #7ec8a0; }
  .list-time {
    font-size: 18px;
    font-weight: 300;
    color: #fff;
    min-width: 46px;
    flex-shrink: 0;
  }
  .list-badge {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }

    font-size: 11px;
    color: #c8d6e8;
    flex: 1;
  }
  .list-min {
    font-size: 11px;
    font-weight: 500;
    color: #8a9bb5;
    white-space: nowrap;
  }

  .footer {
    padding: 10px 16px 14px;
    border-top: 0.5px solid rgba(255,255,255,0.06);
    margin-top: 12px;
  }
  .footer-text {
    font-size: 10px;
    color: #4a6580;
    text-align: center;
  }
</style>
</head>

    </div>
  </div>

  <div class="body">
    <div class="sec-label">ホーム別 次の列車</div>

    <div class="track-card">
      <div class="card-line orange"></div>

        <div class="card-header orange">
          <div class="track-dot orange"></div>

        <div class="card-body orange">

            <div class="next-remain">

              <span class="remain-unit" id="p0-remain-unit">&thinsp;分</span>
            </div>

        </div>
      </div>
    </div>

    <!-- 3・4番線カード -->

  </div>

  <!-- フッター -->
  <div class="footer">
    <div class="footer-text">データ出典：東京メトロ（2026年3月14日改正）</div>
  </div>

</div>

    {h:23,m:40,platform:0,trainType:'local'},
  ]
};

/* ── ユーティリティ ── */
const DAYS = ['日','月','火','水','木','金','土'];

function pad2(n) { return String(n).padStart(2, '0'); }

function formatTime(h, m) { return pad2(h) + ':' + pad2(m); }

function formatRemain(diffMin) {
  if (diffMin < 60) return { val: String(diffMin), unit: '分' };
  const h = Math.floor(diffMin / 60);
  const m = diffMin % 60;
  if (m === 0) return { val: `${h}時間`, unit: '' };
  return { val: `${h}時間${m}`, unit: '分' };
}

function getBadgeClass(trainType) {
  if (trainType === 'semi')    return 'type-badge badge-semi';
  if (trainType === 'express') return 'type-badge badge-exp';
  return 'type-badge badge-local';
}

function getBadgeListClass(trainType) {
  if (trainType === 'semi')    return 'list-badge badge-semi';
  if (trainType === 'express') return 'list-badge badge-exp';
  return 'list-badge badge-local';
}

function getBadgeLabel(trainType) {
  if (trainType === 'semi')    return '準急';
  if (trainType === 'express') return '急行';
  return '普通';
}

function getPlatformLabel(platform) {
  return platform === 0 ? '0番線' : `${platform}番線`;
}

/* ── 状態 ── */
let currentDayType = 'weekday';

function autoDetectDayType() {
  const d = new Date().getDay();
  return (d === 0 || d === 6) ? 'holiday' : 'weekday';
}

function setDayType(type) {
  currentDayType = type;
  document.getElementById('btn-weekday').className = 'cal-btn ' + (type === 'weekday' ? 'active' : 'inactive');
  document.getElementById('btn-holiday').className = 'cal-btn ' + (type === 'holiday' ? 'active' : 'inactive');
  render();
}

/* ── レンダリング ── */
function render() {
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const trains = TIMETABLE[currentDayType];

  // 現在以降の列車
  const upcoming = trains
    .map(t => ({ ...t, totalMin: t.h * 60 + t.m }))
    .filter(t => t.totalMin > nowMin);

  // 0番線の次
  const next0 = upcoming.find(t => t.platform === 0);
  // 3・4番線の次
  const next34 = upcoming.find(t => t.platform === 3 || t.platform === 4);

  // 0番線カード更新
  if (next0) {
    const diff = next0.totalMin - nowMin;
    const rem = formatRemain(diff);
    document.getElementById('p0-time').textContent = formatTime(next0.h, next0.m);
    const badge0 = document.getElementById('p0-badge');
    badge0.className = getBadgeClass(next0.trainType);
    badge0.textContent = getBadgeLabel(next0.trainType);
    document.getElementById('p0-remain').textContent = rem.val;
    document.getElementById('p0-remain-unit').textContent = rem.unit ? '\u2009' + rem.unit : '';
  } else {
    document.getElementById('p0-time').textContent = '終電済';
    document.getElementById('p0-remain').textContent = '--';
    document.getElementById('p0-remain-unit').textContent = '';
  }

  // 3・4番線カード更新
  if (next34) {
    const diff = next34.totalMin - nowMin;
    const rem = formatRemain(diff);
    document.getElementById('p34-label').textContent = `次の列車（${next34.platform}番線）`;
    document.getElementById('p34-time').textContent = formatTime(next34.h, next34.m);
    const badge34 = document.getElementById('p34-badge');
    badge34.className = getBadgeClass(next34.trainType);
    badge34.textContent = getBadgeLabel(next34.trainType);
    document.getElementById('p34-remain').textContent = rem.val;
    document.getElementById('p34-remain-unit').textContent = rem.unit ? '\u2009' + rem.unit : '';
  } else {
    document.getElementById('p34-label').textContent = '次の列車';
    document.getElementById('p34-time').textContent = '終電済';
    document.getElementById('p34-remain').textContent = '--';
    document.getElementById('p34-remain-unit').textContent = '';
  }

  // 列車リスト（5本）
  const listEl = document.getElementById('train-list');
  listEl.innerHTML = '';
  upcoming.slice(0, 5).forEach(t => {
    const diff = t.totalMin - nowMin;
    const rem = formatRemain(diff);
    const pbClass = t.platform === 0 ? 'platform-badge pb-0' : 'platform-badge pb-34';
    const row = document.createElement('div');
    row.className = 'list-row';
    row.innerHTML = `
      <span class="${pbClass}">${getPlatformLabel(t.platform)}</span>
      <span class="list-time">${formatTime(t.h, t.m)}</span>
      <span class="${getBadgeListClass(t.trainType)}">${getBadgeLabel(t.trainType)}</span>
      <span class="list-dest">北綾瀬</span>
      <span class="list-min">${rem.val}${rem.unit ? rem.unit + '後' : '後'}</span>
    `;
    listEl.appendChild(row);
  });
}

/* ── 時計・日付更新 ── */
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  document.getElementById('date-display').textContent =
    `${now.getFullYear()}/${pad2(now.getMonth()+1)}/${pad2(now.getDate())} (${DAYS[now.getDay()]})`;
}

/* ── 初期化 ── */
currentDayType = autoDetectDayType();
document.getElementById('btn-weekday').className = 'cal-btn ' + (currentDayType === 'weekday' ? 'active' : 'inactive');
document.getElementById('btn-holiday').className = 'cal-btn ' + (currentDayType === 'holiday' ? 'active' : 'inactive');
updateClock();
render();
setInterval(() => { updateClock(); render(); }, 60000);
</script>
</body>
